<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MNIST Digit Recognizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        canvas {
            border: 4px solid #2c3e50;
            background-color: black;
            cursor: crosshair;
            border-radius: 4px;
            touch-action: none;
        }
        .button-group {
            margin-top: 15px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.clear-btn { background-color: #e74c3c; }
        button.clear-btn:hover { background-color: #c0392b; }
        #result {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MNIST Digit Recognition</h1>
        <p>Draw a digit (0–9) inside the box:</p>
        
        <canvas id="canvas" width="280" height="280"></canvas>
        
        <div class="button-group">
            <button class="clear-btn" onclick="clearCanvas()">Clear</button>
            <button onclick="predictDigit()">Predict</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let painting = false;

        // MNIST style: White brush on black background
        ctx.strokeStyle = "white";
        ctx.lineWidth = 22;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Mouse Events
        canvas.addEventListener("mousedown", (e) => { painting = true; draw(e); });
        canvas.addEventListener("mouseup", () => { painting = false; ctx.beginPath(); });
        canvas.addEventListener("mousemove", draw);

        // Touch Events for Mobile/Tablets
        canvas.addEventListener("touchstart", (e) => { painting = true; draw(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener("touchend", () => { painting = false; ctx.beginPath(); });
        canvas.addEventListener("touchmove", (e) => { draw(e.touches[0]); e.preventDefault(); });

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById("result").innerText = "";
        }

        async function predictDigit() {
            const imageDataUrl = canvas.toDataURL("image/png");
            
            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: imageDataUrl })
                });
                
                const data = await response.json();
                document.getElementById("result").innerText = `Prediction: ${data.prediction}`;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("result").innerText = "Prediction failed!";
            }
        }
    </script>
</body>
</html>
